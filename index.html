<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dünnschiss Donnerstag – bald geht's los</title>
  <meta name="description" content="Der Newsletter, der jeden Donnerstag kommt. Bald geht's los.">
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    :root {
      --bg: #fbf8f3;
      --brown: #634332;
      --brown-soft: #8a6a55;
      --line: rgba(99, 67, 50, .2);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      background: var(--bg);
      color: var(--brown);
      text-align: center;
      font-family: Georgia, "Times New Roman", serif;
    }
    .card { max-width: 620px; width: 100%; }
    .logo {
      display: block;
      width: min(340px, 75vw);
      height: auto;
      margin: 0 auto;
      animation: fadeIn 1.2s ease-out both;
    }
    .tag {
      display: inline-block;
      margin: 1.6rem 0 .6rem;
      padding: .35rem 1rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: .75rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--brown-soft);
      animation: fadeUp 1s .3s ease-out both;
    }
    h1 {
      margin: .2rem 0 1rem;
      font-size: clamp(2rem, 7vw, 3.4rem);
      font-weight: normal;
      letter-spacing: .01em;
      animation: fadeUp 1s .45s ease-out both;
    }
    .lead {
      margin: 0 auto;
      max-width: 36ch;
      font-size: clamp(1.1rem, 3.5vw, 1.3rem);
      line-height: 1.6;
      color: var(--brown-soft);
      animation: fadeUp 1s .6s ease-out both;
    }
    .lead em { color: var(--brown); }
    .divider {
      width: 60px;
      height: 1px;
      margin: 2.2rem auto 1.6rem;
      background: var(--line);
    }
    .team { animation: fadeUp 1s .75s ease-out both; }
    .team p {
      margin: 0 0 .9rem;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: .85rem;
      color: var(--brown-soft);
    }
    .initials { display: flex; justify-content: center; gap: .6rem; }
    .initials span {
      width: 2.6rem; height: 2.6rem;
      display: grid; place-items: center;
      border: 1px solid var(--brown);
      border-radius: 50%;
      font-size: 1.05rem;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="logo.png" alt="Logo von Dünnschiss Donnerstag: ein Vogel trinkt aus einer Tasse, darunter der Schriftzug Ex abdomine chaos">
    <div class="tag">Coming soon</div>
    <h1>Dünnschiss Donnerstag</h1>
    <p class="lead">
      Seid gespannt, bald geht's los.<br>
      Hier kommt <em>etwas Großes</em> auf euch zu.
    </p>
    <div class="divider"></div>
    <div class="team">
      <p>Mit Liebe gedrückt von eurem Team</p>
      <div class="initials">
        <span>A</span>
        <span>J</span>
        <span>L</span>
      </div>
    </div>
  </main>
</body>
</html>
